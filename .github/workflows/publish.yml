# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── HOW THIS REPO AUTHENTICATES ───────────────────────────────────────────────
#
# npm OIDC Trusted Publishing. There is no NPM_TOKEN secret on the repository or
# the organisation, and 2.0.0 published successfully with a provenance
# attestation, which is only possible through the OIDC exchange. Nothing here
# needs a stored credential, and nothing expires.
#
# That matters because npm's token rules changed underneath everyone in late
# 2025: classic tokens were revoked on 9 December 2025, granular tokens with
# write access are capped at a 90-day lifetime, and `npm login` now issues a
# two-hour session rather than a durable token. None of it touches this
# workflow — it is exactly the position those changes were pushing publishers
# into.
#
# The trusted-publisher entry on npmjs.com predates 20 May 2026, so npm has it
# grandfathered to "allow npm publish". If you ever edit that entry you now have
# to pick an allowed action explicitly: keep it on publish. Choosing stage-only
# makes plain `npm publish` fail, and the workflow would need `npm stage publish`
# plus a human approving each release.
#
# ─── VERSION FLOOR ─────────────────────────────────────────────────────────────
#
# Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
#
# `node-version: lts/*` currently resolves to Node 24.x, which bundles npm 11.19
# — comfortably above the floor. Do NOT pin `node-version: 22`: that line bundles
# npm 10.9.8, below the floor, and publishing would fail with an authentication
# error rather than anything that names the real cause.
#
# @n8n/node-cli >= 0.23.0 is also required; `npm run release` detects CI and
# publishes with NPM_CONFIG_PROVENANCE=true. Check with `npm list @n8n/node-cli`.
#
# ─── IF OIDC EVER HAS TO BE REPLACED ───────────────────────────────────────────
#
# Fallback only, and a worse one than it used to be. Generate a granular access
# token on npmjs.com scoped to this package with read-and-write publish rights,
# store it as the NPM_TOKEN repository secret, and put a reminder in the calendar
# — it expires within 90 days and the release will fail silently until it is
# rotated. The step below picks it up automatically when the secret exists.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Locally, on a clean `main` that is pushed and ahead of its upstream:
#
#   GITHUB_TOKEN=$(gh auth token) npm run release
#
# That lints, builds, prompts for the version bump, regenerates the changelog,
# commits, tags and pushes — and the tag push triggers this workflow, which does
# the actual npm publish. It does not publish from your machine.
#
# The GITHUB_TOKEN is only for creating the GitHub Release. Without it release-it
# still does everything else and then prints a `releases/new?...` URL for you to
# open and submit by hand. `dotenv` in the release script reads it from a local
# `.env` if you would rather keep it there; `.env` is gitignored.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — the token step is skipped and
        #   npm uses the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets — it is written to
        #   .npmrc here before publishing.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
